# Codecov configuration.
#
# Coverage arrives from two CI sources, each tagged with a flag so Codecov keeps
# them straight:
#   - `unit`        — native + wasm-bindgen-test reports (build job), every push/PR.
#   - `integration` — live-JackTrip-server browser run (integration job). This job
#                     needs the MIKED_TLS_* secrets, which GitHub withholds from
#                     fork PRs, so it does NOT run on forks.
#
# Codecov unions all flags by file:line, so a line covered by either source counts.
# `carryforward: true` on `integration` means a commit that doesn't re-run the
# integration job (fork PRs) inherits the previous integration coverage instead of
# treating those lines as newly uncovered.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: integration
      carryforward: true

coverage:
  status:
    project:
      default:
        # Don't fail the whole project status on the fork-PR gap, where the
        # integration flag is carried forward rather than freshly measured.
        informational: true
    patch:
      default:
        informational: true

# Test-only scaffolding: these files exist solely to support the test suites and
# are compiled only under `cfg(test)`. The wasm coverage build still instruments
# them, so without this list their helpers (e.g. a trait method a test never
# calls, like `MockTransport::transport_type`) would count as uncovered and drag
# the percentage down. They carry no production logic worth measuring.
ignore:
  - "src/test_support.rs"     # shared wasm-bindgen-test helpers + MockTransport
  - "src/api/test_helpers.rs" # mockito HTTP-fixture builders
  - "tests"                   # standalone integration/harness test binaries
