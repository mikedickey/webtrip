name: Release

# Pushing a vX.Y.Z tag releases that commit: the production image main CI
# already built for it gets version tags, then the crates go to crates.io
# (which makes docs.rs build their docs). See docs/contributing/releasing.md.
on:
  push:
    tags: ['v*']

# One release at a time; never cancel a half-finished publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mikedickey/webtrip-build
  WEBTRIP_IMAGE: ghcr.io/mikedickey/webtrip

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Refuse tags that don't match the crate version or that point at a commit
  # main CI never ran on (its production image is what gets tagged).
  # ──────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      builder: ${{ steps.fingerprint.outputs.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match [workspace.package] version $crate in Cargo.toml"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main; release tags must point at a commit main CI has built"; exit 1; }

      # Same build container CI used for this commit.
      - name: Compute container fingerprint
        id: fingerprint
        run: echo "ref=${{ env.IMAGE }}:$(scripts/container-fingerprint.sh)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Add version tags to the image main CI pushed for this commit. That image
  # only exists once main's build and integration gates passed, so this job
  # also gates the crates.io publish below.
  # ──────────────────────────────────────────────────────────────────────────
  image:
    name: Tag production image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag pushed right after a merge can arrive before main CI finishes.
      - name: Wait for main CI's image
        timeout-minutes: 45
        run: |
          src="${{ env.WEBTRIP_IMAGE }}:sha-$GITHUB_SHA"
          until docker manifest inspect "$src" >/dev/null 2>&1; do
            echo "waiting for $src (main CI still running, or it failed for this commit)"
            sleep 30
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # X.Y.Z always; X.Y too unless this is a pre-release (X.Y.Z-rc.1).
      - name: Add version tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tags=(-t "$WEBTRIP_IMAGE:$VERSION")
          case "$VERSION" in
            *-*) ;;
            *)   tags+=(-t "$WEBTRIP_IMAGE:${VERSION%.*}") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$WEBTRIP_IMAGE:sha-$GITHUB_SHA"

  # ──────────────────────────────────────────────────────────────────────────
  # Publish all four crates in dependency order. Trusted publishing: the OIDC
  # token is exchanged for a short-lived crates.io token, no stored secret.
  # ──────────────────────────────────────────────────────────────────────────
  crates:
    name: Publish crates
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    container:
      image: ${{ needs.verify.outputs.builder }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: npm ci
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: npm run publish:crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
