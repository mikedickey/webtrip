[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/web", "crates/webtrip"]
# `npm run test`/`check` name members explicitly; a bare `cargo` at the root
# builds the browser host, which only compiles with the wasm flags in package.json.

[workspace.package]
authors = ["Mike Dickey"]
edition = "2021"
version = "0.2.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikedickey/webtrip"
homepage = "https://webtrip.dev"
