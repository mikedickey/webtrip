[workspace]
resolver = "2"
members = ["crates/webtrip-core", "crates/webtrip-api", "crates/webtrip-web"]
# `npm run test`/`check` name members explicitly; a bare `cargo` at the root
# builds the browser host, which only compiles with the wasm flags in package.json.

[workspace.package]
authors = ["Mike Dickey"]
edition = "2021"
publish = false
version = "0.1.0"
