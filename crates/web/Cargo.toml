[package]
name = "webtrip-web"
description = "WebTrip browser host: AudioWorklet engine, WebRTC and WebTransport transports, WebTripSession"
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["audio", "jacktrip", "webrtc", "webtransport", "wasm"]
categories = ["multimedia::audio", "wasm", "web-programming"]

# docs.rs builds on nightly and does not link, so the shared-memory link args
# in package.json are not needed here; atomics + build-std are (std must match).
[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
rustc-args = ["--cfg=web_sys_unstable_apis", "-Ctarget-feature=+atomics"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]
cargo-args = ["-Zbuild-std=std,panic_abort"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables the `__coverage_dump` export used by the integration harness to pull
# LLVM profile data out of the live (browser) WASM build. Pair with the
# instrument-coverage rustflags (see `build:wasm:coverage` in package.json);
# never enable for a shipped build.
coverage = ["dep:minicov"]

[dependencies]
console_error_panic_hook = "0.1.7"
# Supplies the LLVM profiler runtime (we build with `-Zno-profiler-runtime`) and
# a `capture_coverage` sink. Only compiled under the `coverage` feature.
minicov = { version = "0.3.8", optional = true }
log = "0.4"
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"

webtrip-core = { path = "../core", version = "0.2.3", features = ["wasm"] }
webtrip-api = { path = "../api", version = "0.2.3", features = ["wasm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

web-sys = { version = "0.3.83", features = [
  # AudioContext and worklet
  "AudioContext",
  "AudioContextOptions",
  "AudioDestinationNode",
  "AudioNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "ChannelCountMode",
  "ChannelInterpretation",
  "MessagePort",
  
  # MediaDevices API
  "MediaDeviceInfo",
  "MediaDeviceKind",
  "MediaDevices",
  "MediaStream",
  "MediaStreamAudioSourceNode",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MediaTrackSettings",
  "MediaTrackCapabilities",
  "ULongRange",
  
  # For dependent_module (worklet.js loading)
  "Blob",
  "BlobPropertyBag",
  "Url",
  
  # Browser APIs
  "Navigator",
  "Window",
  "console",
  "CloseEvent",
  "CloseEventInit",
  "Event",
  "EventTarget",
  "ErrorEvent",
  "ErrorEventInit",
  
  # WebRTC for JackTrip protocol
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelEventInit",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcIceConnectionState",
  "RtcIceGatheringState",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSignalingState",
  "RtcIceServer",
  
  # For binary data handling
  "Crypto",
  "MessageEvent",
  "MessageEventInit",
  
  # WebSocket for signaling
  "WebSocket",
  "BinaryType",
  
  # RTC events
  "RtcTrackEvent",
  
  # Worker API for WebTransport dedicated thread
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "DedicatedWorkerGlobalScope",
  
  # WebTransport API
  "WebTransport",
  "WebTransportBidirectionalStream",
  "WebTransportCloseInfo",
  "WebTransportCongestionControl",
  "WebTransportDatagramDuplexStream",
  "WebTransportError",
  "WebTransportErrorOptions",
  "WebTransportErrorSource",
  "WebTransportHash",
  "WebTransportOptions",
  "WebTransportReceiveStream",
  "WebTransportSendStream",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "WritableStream",
  "WritableStreamDefaultWriter",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
